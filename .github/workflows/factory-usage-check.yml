name: Factory Usage Check

# 觸發條件：PR 提交時檢查測試文件
on:
  # Auto-trigger restored 2026-04-24. Historical PR runs averaged ~30s,
  # so the cost is negligible and catches factory-usage drift on the spot.
  pull_request:
    paths:
      - '**/__tests__/**'
      - '**/*.test.ts'
      - '**/*.spec.ts'
      - 'packages/testing-utils/**'

  # 允許手動觸發
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-factory-usage:
    name: 檢查 Factory 使用情況
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 需要完整歷史以比對變更

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 運行 Factory 使用檢查
        id: check
        run: |
          # 非阻塞模式運行檢查
          OUTPUT_FORMAT=github node scripts/check-factory-usage.cjs > check-output.txt 2>&1 || true

          # 保存結果
          cat check-output.txt

          # 提取統計數據
          ERRORS=$(grep -oP '錯誤: \K\d+' check-output.txt || echo "0")
          WARNINGS=$(grep -oP '警告: \K\d+' check-output.txt || echo "0")

          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT

      - name: 評論 PR（如有問題）
        if: steps.check.outputs.errors > 0 || steps.check.outputs.warnings > 0
        uses: actions/github-script@v8
        with:
          script: |
            const errors = parseInt('${{ steps.check.outputs.errors }}')
            const warnings = parseInt('${{ steps.check.outputs.warnings }}')

            let message = '## 🧪 Factory 使用檢查報告\n\n'

            if (errors > 0) {
              message += `### ❌ 發現 ${errors} 個錯誤\n\n`
              message += '這些錯誤**必須修復**才能確保測試數據一致性：\n\n'
              message += '1. 為使用 factory 的測試添加 `resetAllFactories()`\n'
              message += '2. 確保正確導入 `@makanmasak/testing-utils`\n\n'
              message += '**修復範例**：\n'
              message += '```typescript\n'
              message += 'import { userFactory, resetAllFactories } from "@makanmasak/testing-utils"\n\n'
              message += 'describe("Test Suite", () => {\n'
              message += '  beforeEach(() => {\n'
              message += '    resetAllFactories() // 添加這一行\n'
              message += '  })\n'
              message += '})\n'
              message += '```\n\n'
            }

            if (warnings > 0) {
              message += `### ⚠️ 發現 ${warnings} 個警告\n\n`
              message += '建議處理以下問題以提升測試質量：\n\n'
              message += '1. 考慮使用 factory 替代手動數據創建\n'
              message += '2. 拆分過大的測試文件\n\n'
              message += '**參考文檔**：\n'
              message += '- [Factory 快速參考](../docs/testing/FACTORY_QUICK_REFERENCE.md)\n'
              message += '- [Factory FAQ](../docs/testing/FACTORY_FAQ.md)\n\n'
            }

            message += '---\n'
            message += '_這是自動檢查，不會阻塞 PR 合併。但建議盡快修復問題。_'

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })

      - name: 添加標籤（如有錯誤）
        if: steps.check.outputs.errors > 0
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['needs-factory-fix', 'testing']
            })

      - name: 添加標籤（如有警告）
        if: steps.check.outputs.warnings > 0 && steps.check.outputs.errors == 0
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['testing-improvement-suggested']
            })

      - name: 完美狀態評論
        if: steps.check.outputs.errors == 0 && steps.check.outputs.warnings == 0
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ✅ Factory 使用檢查通過\n\n所有測試文件都正確使用 factory！👏'
            })

      # 狀態檢查（非阻塞）
      - name: 設置檢查狀態
        if: always()
        run: |
          if [ "${{ steps.check.outputs.errors }}" -gt "0" ]; then
            echo "⚠️ 發現錯誤，但不阻塞 PR"
          else
            echo "✅ 檢查通過"
          fi
