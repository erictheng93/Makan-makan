name: 🚀 Production Deploy

# Deploys to production from main after explicit manual confirmation.
# The auto workflow_run chain remains disabled until this repository has a
# supported required-reviewer environment gate or an equivalent approval process.
#
# The GitHub 'production' environment is configured with a main-only deployment
# branch policy. Required reviewers are not enabled because GitHub returned 422
# for environment reviewer protection on the current repository plan.

on:
  # Auto-deploy chain via workflow_run is temporarily DISABLED while:
  #   - required-reviewer protection is unavailable on the current GitHub plan
  #   - production deploys should remain an explicit operator action
  # Re-enable only after the approval gate is enforceable.
  # workflow_run:
  #   workflows: ["🧪 MakanMakan 測試流水線"]
  #   types: [completed]
  #   branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "DEPLOY PRODUCTION" to deploy main to production.'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: "22"

jobs:
  # Gate: only proceed if the test pipeline succeeded
  check-tests:
    name: ✅ 確認測試通過
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        inputs.confirm_production == 'DEPLOY PRODUCTION') ||
      github.event.workflow_run.conclusion == 'success'


    steps:
      - run: echo "Production deploy gate passed."

  deploy-production:
    name: 🚀 部署到正式環境
    runs-on: ubuntu-latest
    needs: check-tests
    environment: production
    timeout-minutes: 20

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@v6

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置應用程式
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: 🚀 部署到 Cloudflare (Production)
        run: pnpm run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: ⏳ 等待部署生效
        run: sleep 15

      - name: 🧪 部署後煙霧測試
        run: |
          # Public liveness probe — /info is the only unauthenticated 200 route
          # (CLAUDE.md "Debug Tools"). /api/v1/health does NOT exist; the older
          # /health route 302-redirects to /api/v1/monitoring/health which is
          # auth-gated, so it cannot be used for an unauthenticated curl probe.
          curl --fail --retry 3 --retry-delay 5 \
            "$PRODUCTION_URL/info" \
            -o /dev/null -w "API liveness (/info): HTTP %{http_code} in %{time_total}s\n"

          # Verify customer app is serving HTML
          curl --fail --retry 3 --retry-delay 5 \
            "$PRODUCTION_URL" \
            -o /dev/null -w "Customer app: HTTP %{http_code} in %{time_total}s\n"

          # Verify kitchen display app is serving HTML
          curl --fail --retry 3 --retry-delay 5 \
            "$PRODUCTION_KITCHEN_URL" \
            -o /dev/null -w "Kitchen display app: HTTP %{http_code} in %{time_total}s\n"

          # Image-processor liveness — /info is public (no auth) on the Worker
          curl --fail --retry 3 --retry-delay 5 \
            "https://images.makanmasak.com/info" \
            -o /dev/null -w "Image processor (/info): HTTP %{http_code} in %{time_total}s\n"
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          PRODUCTION_KITCHEN_URL: ${{ secrets.PRODUCTION_KITCHEN_URL }}

      - name: 📊 部署摘要
        if: always()
        run: |
          echo "## 🚀 Production Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          COMMIT_SHA="${{ github.sha }}"
          echo "**Commit**: ${COMMIT_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "**時間**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          JOB_STATUS="${{ job.status }}"
          if [ "$JOB_STATUS" == "success" ]; then
            echo "### ✅ 部署成功" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ 部署失敗 — 請檢查 logs" >> $GITHUB_STEP_SUMMARY
          fi
