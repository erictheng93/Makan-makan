name: Test Documentation Check

on:
  pull_request:
    paths:
      - '**/__tests__/**'
      - '**/*.test.ts'
      - '**/*.test.js'
      - '**/*.spec.ts'
      - '**/*.spec.js'
      - 'tests/**'
      - 'docs/testing/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-test-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/__tests__/**
            **/*.test.ts
            **/*.test.js
            **/*.spec.ts
            **/*.spec.js
            tests/**

      - name: Get changed docs
        id: changed-docs
        uses: tj-actions/changed-files@v46
        with:
          files: |
            docs/testing/**
            **/README.md

      - name: Check if tests changed but docs didn't
        id: check-docs
        run: |
          TEST_CHANGED="${{ steps.changed-files.outputs.any_changed }}"
          DOCS_CHANGED="${{ steps.changed-docs.outputs.any_changed }}"

          echo "Tests changed: $TEST_CHANGED"
          echo "Docs changed: $DOCS_CHANGED"

          if [ "$TEST_CHANGED" == "true" ] && [ "$DOCS_CHANGED" == "false" ]; then
            echo "needs_docs_update=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tests were modified but documentation was not updated"
          else
            echo "needs_docs_update=false" >> $GITHUB_OUTPUT
            echo "✅ Documentation check passed"
          fi

      - name: Comment on PR if docs need update
        if: steps.check-docs.outputs.needs_docs_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📝 測試文檔更新提醒')
            );

            const commentBody = `## 📝 測試文檔更新提醒

⚠️ **檢測到測試文件已修改,但測試文檔未更新**

### 已變更的測試文件

\`\`\`
${{ steps.changed-files.outputs.all_changed_files }}
\`\`\`

### 📋 建議行動

請確認是否需要更新以下文檔:

- [ ] \`docs/testing/TESTING_GUIDE.md\` - 如果新增了測試類型或改變了測試策略
- [ ] 相關模組的 README - 如果新增了測試範例或使用說明
- [ ] \`docs/testing/\` 下的專項文檔 - 如果涉及特定測試領域

### ℹ️ 何時需要更新文檔？

**需要更新**:
- ✅ 新增了測試場景或測試用例
- ✅ 修改了測試策略或測試方法
- ✅ 新增了測試工具或測試輔助函數
- ✅ 修改了重要的測試配置

**不需要更新**:
- ✅ 只是修復測試中的小 bug
- ✅ 只是調整測試數據
- ✅ 只是重構測試代碼但功能不變

### 🔗 相關文檔

- [測試指南](../docs/testing/TESTING_GUIDE.md)
- [測試文檔維護指南](../docs/testing/TEST_DOCUMENTATION_GUIDE.md)
- [貢獻指南](../CONTRIBUTING.md)

---

如果您認為此次變更不需要更新文檔,請在 PR 描述中說明原因。
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      - name: Add documentation label
        if: steps.check-docs.outputs.needs_docs_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['documentation', 'needs-docs-update']
            });

      - name: Check test coverage changes
        id: coverage-check
        run: |
          # 檢查是否有新的測試文件但沒有對應的文檔說明
          NEW_TEST_FILES=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}... | grep -E '\.test\.(ts|js)$' | wc -l)

          echo "New test files: $NEW_TEST_FILES"
          echo "new_test_files=$NEW_TEST_FILES" >> $GITHUB_OUTPUT

          if [ "$NEW_TEST_FILES" -gt 0 ]; then
            echo "⚠️ Detected $NEW_TEST_FILES new test file(s)"
          fi

      - name: Generate test summary
        if: steps.coverage-check.outputs.new_test_files > 0
        run: |
          echo "## 📊 測試變更摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **新增測試文件**: ${{ steps.coverage-check.outputs.new_test_files }} 個" >> $GITHUB_STEP_SUMMARY
          echo "- **修改測試文件**: ${{ steps.changed-files.outputs.all_changed_files_count }} 個" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 提醒事項" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 請確保新增的測試有相應的文檔說明" >> $GITHUB_STEP_SUMMARY
          echo "- 請更新測試覆蓋率報告 (如適用)" >> $GITHUB_STEP_SUMMARY
          echo "- 請在 PR 描述中說明測試變更的目的" >> $GITHUB_STEP_SUMMARY

      - name: Final status
        run: |
          if [ "${{ steps.check-docs.outputs.needs_docs_update }}" == "true" ]; then
            echo "⚠️ 建議更新測試文檔"
            echo "這不會阻止 PR 合併,但建議更新文檔以保持同步"
            exit 0  # 不失敗 CI,只是提醒
          else
            echo "✅ 文檔檢查通過"
          fi
