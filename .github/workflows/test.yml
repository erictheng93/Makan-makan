name: 🧪 MakanMakan 測試流水線

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-flight runs on the same PR when a new commit lands so reviewers
# only see the latest result; on push to main/develop never cancel because
# we want main's history to record every commit's status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: "22"

jobs:
  # 程式碼品質檢查
  lint-and-typecheck:
    name: 📝 程式碼檢查
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v5

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@v5

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🔍 ESLint 檢查
        run: pnpm run lint

      - name: 🎯 TypeScript 型別檢查
        run: pnpm run typecheck

      - name: 💅 Prettier 格式檢查
        run: pnpm exec prettier --check "**/*.{ts,js,vue,json,md}"

      - name: 🔒 整合測試白名單檢查
        run: node scripts/check-integration-allowlist.cjs

  # 單元測試
  unit-tests:
    name: 🧪 單元測試
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 20

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v5

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@v5

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置內部套件
        run: pnpm run build

      - name: 🧪 執行所有單元測試
        run: pnpm exec vitest run

      - name: 📊 產生覆蓋率報告
        # Coverage thresholds in vitest.config.ts are aspirational targets.
        # Codecov tracks trends and gates PRs separately, so threshold
        # failures here should not block the pipeline.
        run: pnpm exec vitest run --coverage
        continue-on-error: true

      - name: ☂️ 上傳覆蓋率到 Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unit-tests
          name: unit-tests

      - name: 📎 上傳測試結果
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  # Cloudflare Workers 測試
  workers-tests:
    name: ⚡ Workers 測試
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 15

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v5

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@v5

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🔧 安裝 Wrangler CLI
        run: pnpm add -g wrangler

      - name: ⚡ 測試 Cloudflare Workers
        # Existence check (not `||`) so the step distinguishes "no tests in
        # this directory yet" (skip) from "tests exist but failed" (fail).
        # The previous `pnpm run test:workers || echo "skip"` swallowed all
        # failures regardless of cause.
        run: |
          if [ -d "tests/unit/workers" ] && [ -n "$(find tests/unit/workers -name '*.test.ts' -print -quit)" ]; then
            pnpm run test:workers
          else
            echo "No workers tests found in tests/unit/workers, skipping"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 📊 Workers 整合測試
        # Same existence-check pattern as above. Integration tests live
        # under tests/integration/workers per the package.json script.
        run: |
          if [ -d "tests/integration/workers" ] && [ -n "$(find tests/integration/workers -name '*.test.ts' -print -quit)" ]; then
            pnpm run test:workers:integration
          else
            echo "No workers integration tests found in tests/integration/workers, skipping"
          fi
        env:
          TEST_D1_DATABASE: ${{ secrets.TEST_D1_DATABASE }}
          TEST_KV_NAMESPACE: ${{ secrets.TEST_KV_NAMESPACE }}

  # Real integration 測試 (miniflare D1 + 真 drizzle)
  #
  # Runs API test files that need a real Cloudflare miniflare instance
  # (real D1, real drizzle) via apps/api/vitest.real-integration.config.ts.
  # That config serialises files (fileParallelism: false, maxWorkers: 1)
  # because miniflare's workerd IPC fails under parallel boot pressure —
  # the default vitest config's 10s timeout + 158-file parallelism is too
  # tight for miniflare setup, so these tests live in a separate config
  # with 30s timeouts and serial execution.
  #
  # Before this job existed, these tests either flaked in unit-tests
  # (when named *.test.ts) or ran nowhere (when named
  # *.real.integration.test.ts, excluded from the default config but
  # never invoked in CI).
  #
  real-integration-tests:
    name: 🔬 真實整合測試 (miniflare D1)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 15

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v5

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@v5

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置內部套件
        run: pnpm --filter @makanmakan/api^... build

      - name: 🔬 執行真實整合測試
        run: pnpm test:real-integration

  # E2E 測試 (mock API — no real backend needed)
  #
  # All customer/journey tests use page.route() mocks from
  # tests/e2e/helpers/mock-api.ts to intercept API calls. Admin tests
  # use preAuthAdmin() + mock routes. Integration tests (real API) are
  # excluded — they require a live backend and should run in nightly CI.
  #
  # Runs inside the pinned Playwright Linux container so browser binaries
  # and system dependencies are pre-installed. Upgrading Playwright
  # requires bumping BOTH the image tag below AND the @playwright/test
  # version in package.json in the same PR.
  e2e-tests:
    name: 🎭 E2E 測試
    # Non-blocking: E2E is not yet in required status checks.
    # Add to required checks once the suite is stable and consistently
    # finishes within the timeout.
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [unit-tests, workers-tests]
    # Solo-dev fast-feedback gate: only run on main/develop pushes or manual
    # dispatch. Feature branch pushes get fast unit+workers feedback only;
    # full E2E coverage runs automatically when merging to main/develop.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v5

      - name: 📦 啟用 pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置 customer-app + admin-dashboard
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          pnpm build \
            --filter=makanmakan-customer-app \
            --filter=makanmakan-admin-dashboard

      - name: 🚀 啟動 preview servers
        run: |
          mkdir -p /tmp/preview-logs
          (cd apps/customer-app    && npx vite preview --port 3000 --host 0.0.0.0 > /tmp/preview-logs/customer.log 2>&1 &)
          (cd apps/admin-dashboard && npx vite preview --port 3001 --host 0.0.0.0 > /tmp/preview-logs/admin.log    2>&1 &)

      - name: ⏳ 等待 preview servers 就緒
        run: |
          npx wait-on \
            http://localhost:3000 \
            http://localhost:3001 \
            --timeout 60000

      - name: 🧪 執行 E2E 測試 (chromium + admin)
        # Runs customer/journey tests on chromium + admin dashboard tests.
        # Integration tests are excluded (they need a real backend).
        # Multi-browser expansion (firefox, webkit) can be added once
        # chromium is green.
        run: npx playwright test --project=chromium --project=admin
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_URL: http://localhost:3001

      - name: 🛑 停止測試服務器
        if: always()
        run: |
          pkill -f "vite preview" || true

      - name: 📎 上傳測試報告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

      - name: 📸 上傳測試截圖
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots-e2e
          path: test-results/
          retention-days: 7

  # 效能測試
  performance-tests:
    name: 🚀 效能測試
    runs-on: ubuntu-latest
    needs: [unit-tests, workers-tests]
    # Solo-dev fast-feedback gate: main/develop pushes or manual dispatch only.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    timeout-minutes: 30

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v5

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@v5

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置應用程式
        run: pnpm run build

      - name: 🚀 啟動測試服務器
        run: |
          # Use explicit subshells: `cmd1 && cmd2 &` parses as `(cmd1 && cmd2) &`,
          # which runs `cd` inside the backgrounded subshell and never updates
          # the parent shell's cwd. Without parens, line 3 below tries to `cd
          # ../realtime` from workspace root and errors out with ENOENT.
          (cd apps/api && pnpm dev) &
          echo $! > api-server.pid
          (cd apps/realtime && pnpm dev) &
          echo $! > realtime-server.pid
        env:
          NODE_ENV: test

      - name: ⏳ 等待服務器啟動
        run: |
          # /info is the app-level public endpoint that returns 200 JSON.
          # /api/v1/health does NOT exist as a route — the app has `app.get("/health")`
          # (app-level, 302 redirect to /api/v1/monitoring/health which is auth-gated)
          # and `app.get("/info")` (public). Use /info so wait-on sees 200 immediately.
          npx wait-on http://localhost:8787/info --timeout 60000
          # tcp: probe waits for the port to be listening rather than attempting a
          # WebSocket handshake, which is more reliable under CI startup timing.
          npx wait-on tcp:localhost:8788 --timeout 60000

      - name: 📦 安裝 Artillery
        run: pnpm add -g artillery@latest

      - name: 🔥 執行 REST API 負載測試
        run: |
          artillery run tests/performance/artillery-api.yml \
            --output artillery-api-report.json \
            --quiet
        env:
          API_URL: http://localhost:8787
          TEST_USERNAME: testuser
          TEST_PASSWORD: testpass123

      - name: 🌐 執行 WebSocket 負載測試
        run: |
          artillery run tests/performance/artillery-websocket.yml \
            --output artillery-ws-report.json \
            --quiet
        env:
          API_URL: http://localhost:8787
          WS_URL: ws://localhost:8788

      - name: 📊 生成 Artillery 報告
        if: always()
        run: |
          if [ -f artillery-api-report.json ]; then
            artillery report artillery-api-report.json --output artillery-api-report.html
          fi
          if [ -f artillery-ws-report.json ]; then
            artillery report artillery-ws-report.json --output artillery-ws-report.html
          fi

      - name: 📎 上傳性能測試報告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-test-reports
          path: |
            artillery-api-report.json
            artillery-api-report.html
            artillery-ws-report.json
            artillery-ws-report.html
          retention-days: 30

      - name: 🛑 停止測試服務器
        if: always()
        run: |
          if [ -f api-server.pid ]; then
            kill $(cat api-server.pid) || true
            rm api-server.pid
          fi
          if [ -f realtime-server.pid ]; then
            kill $(cat realtime-server.pid) || true
            rm realtime-server.pid
          fi

      - name: 🚀 Lighthouse CI (僅 main 分支)
        if: github.ref == 'refs/heads/main'
        run: |
          pnpm add -g @lhci/cli@0.12.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        continue-on-error: true

  # 資料庫性能測試
  #
  # As of Issue #9 / 2026-04-10 the test fixture uses a real in-memory
  # SQLite database with the full Drizzle migration stack applied (see
  # tests/helpers/test-db.ts + tests/helpers/d1-adapter.ts). The test suite
  # therefore actually exercises query planner behavior and index selection,
  # so the historical `continue-on-error: true` workaround has been
  # removed — failures here now fail the pipeline.
  database-performance-tests:
    name: 🗄️ 資料庫性能測試
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # Solo-dev fast-feedback gate: main/develop pushes or manual dispatch only.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    timeout-minutes: 15

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 需要完整歷史以獲取基準線

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@v5

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🔨 編譯 better-sqlite3 native binding
        # pnpm 10 + `--frozen-lockfile` does not always run the package's
        # `install` script even when `onlyBuiltDependencies` allowlists it,
        # so the prebuild-install step that downloads the native binding is
        # skipped and `new Database(...)` throws "Could not locate the
        # bindings file" inside tests/helpers/test-db.ts. Force the rebuild
        # explicitly so the binding is always present for the perf suite.
        run: pnpm rebuild better-sqlite3

      - name: 📊 檢查性能基準線是否存在
        id: check-baseline
        run: |
          if [ -f "tests/performance/baselines/db-baseline.json" ]; then
            echo "baseline_exists=true" >> $GITHUB_OUTPUT
          else
            echo "baseline_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔧 建立性能基準線 (如果不存在)
        if: steps.check-baseline.outputs.baseline_exists == 'false'
        run: |
          cd tests/performance/db-benchmarks
          pnpm exec tsx create-baseline.ts ${{ github.sha }}
        continue-on-error: true

      - name: 🧪 執行資料庫性能測試
        run: pnpm test tests/performance/db-benchmarks/query-performance.test.ts

      - name: 🔍 執行 N+1 查詢檢測
        run: pnpm test tests/performance/db-benchmarks/n-plus-one-detection.test.ts

      - name: 📊 性能退化檢測
        if: steps.check-baseline.outputs.baseline_exists == 'true'
        run: |
          cd tests/performance/db-benchmarks
          pnpm exec tsx compare-performance.ts --fail-on-regression --warning-threshold 20 --failure-threshold 50

      - name: 📈 生成性能報告
        if: always()
        run: |
          echo "## 🗄️ 資料庫性能測試報告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 測試結果" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 查詢性能測試: 已完成" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ N+1 查詢檢測: 已完成" >> $GITHUB_STEP_SUMMARY
          if [ -f "tests/performance/baselines/db-baseline.json" ]; then
            echo "- ✅ 性能退化檢測: 已完成" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ 性能退化檢測: 跳過 (首次運行)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "詳細報告請查看 Artifacts 區域" >> $GITHUB_STEP_SUMMARY

      - name: 📎 上傳性能基準線
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: db-performance-baseline
          path: tests/performance/baselines/db-baseline.json
          retention-days: 90

      - name: 💬 PR 性能報告留言 (僅 PR)
        if: github.event_name == 'pull_request' && steps.check-baseline.outputs.baseline_exists == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const baseline = JSON.parse(fs.readFileSync('tests/performance/baselines/db-baseline.json', 'utf8'));

            let comment = '## 🗄️ 資料庫性能測試報告\n\n';
            comment += '### 📊 性能概覽\n\n';
            comment += '| 查詢類別 | 平均時間 | 狀態 |\n';
            comment += '|---------|---------|------|\n';

            const categories = {};
            for (const [name, metrics] of Object.entries(baseline.queries)) {
              const category = metrics.category || 'other';
              if (!categories[category]) categories[category] = [];
              categories[category].push(metrics.avgTime);
            }

            for (const [category, times] of Object.entries(categories)) {
              const avg = times.reduce((a, b) => a + b, 0) / times.length;
              const status = avg < 50 ? '🟢 優秀' : avg < 100 ? '🟡 良好' : '🔴 需優化';
              comment += `| ${category} | ${avg.toFixed(2)}ms | ${status} |\n`;
            }

            comment += '\n---\n\n';
            comment += '📋 完整報告請查看 Actions 的 Artifacts 區域\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # 視覺回歸測試 (Playwright native screenshots)
  #
  # Runs inside the pinned Playwright Linux container so the CI environment
  # byte-matches what scripts/update-visual-baselines.sh produces locally.
  # Upgrading Playwright requires bumping BOTH the image tag below AND the
  # @playwright/test version in package.json in the same PR.
  visual-regression-tests:
    name: 👁️ 視覺回歸測試
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # Solo-dev fast-feedback gate: main/develop pushes or manual dispatch only.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v5

      - name: 📦 啟用 pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置 5 個前端應用（scoped）
        # Scoped build: visual regression only needs the 5 frontend preview
        # servers. Avoids unrelated build failures in backend workers and
        # keeps this job fast. Must match scripts/update-visual-baselines.sh.
        #
        # VITE_API_BASE_URL: customer-app's api.ts throws at module init if
        # unset. Use a relative `/api/v1` so requests go to the same origin —
        # customer-app's CSP meta tag only allows `connect-src 'self' https:
        # wss: https://*.makanmakan.app`, so an absolute http://mock.local URL
        # would be blocked by CSP before Playwright can intercept it.
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          pnpm build \
            --filter=makanmakan-customer-app \
            --filter=makanmakan-admin-dashboard \
            --filter=makanmakan-kitchen-display \
            --filter=makanmakan-management-portal \
            --filter=makanmakan-onboarding-app

      - name: 🚀 啟動 Preview Servers
        # Each preview runs in a subshell so `cd` does not leak between lines.
        # --host 0.0.0.0 ensures the test runner (same container) can reach them.
        run: |
          mkdir -p /tmp/preview-logs
          (cd apps/customer-app      && npx vite preview --port 3000 --host 0.0.0.0 > /tmp/preview-logs/customer.log   2>&1 &)
          (cd apps/admin-dashboard   && npx vite preview --port 3001 --host 0.0.0.0 > /tmp/preview-logs/admin.log      2>&1 &)
          (cd apps/kitchen-display   && npx vite preview --port 3002 --host 0.0.0.0 > /tmp/preview-logs/kitchen.log    2>&1 &)
          (cd apps/management-portal && npx vite preview --port 3010 --host 0.0.0.0 > /tmp/preview-logs/management.log 2>&1 &)
          (cd apps/onboarding-app    && npx vite preview --port 3011 --host 0.0.0.0 > /tmp/preview-logs/onboarding.log 2>&1 &)

      - name: ⏳ 等待所有服務啟動
        run: |
          npx wait-on \
            http://localhost:3000 \
            http://localhost:3001 \
            http://localhost:3002 \
            http://localhost:3010 \
            http://localhost:3011 \
            --timeout 120000

      - name: 📸 執行視覺回歸測試
        run: npx playwright test --config playwright.visual.config.ts

      - name: 📎 上傳測試報告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-regression-report
          path: playwright-report/visual/
          retention-days: 30

      - name: 📎 上傳 Screenshot Diffs（失敗時）
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-regression-diffs
          path: test-results/
          retention-days: 7

  # 安全性測試 (增強版)
  security-tests:
    name: 🔐 安全性測試
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # Solo-dev fast-feedback gate: main/develop pushes or manual dispatch only.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    timeout-minutes: 30

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v5

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@v5

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🛡️ Snyk 深度安全掃描
        # continue-on-error: Snyk is an external SaaS — auth failures (SNYK-0005)
        # and maintenance windows (503) should not block the pipeline. CodeQL
        # remains the hard-fail SAST gate.
        continue-on-error: true
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # pinned from master on 2026-04-08
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high --json-file-output=snyk-report.json

      - name: 📊 Snyk 許可證合規檢查
        if: always()
        run: |
          pnpm add -g snyk
          snyk test --all-projects --fail-on=upgradable --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: 🔒 CodeQL 靜態分析初始化
        # CodeQL also runs as a dedicated workflow (codeql-analysis.yml).
        # This in-job copy is a convenience — failures here should not
        # block the pipeline since the dedicated workflow is authoritative.
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: +security-extended,security-and-quality

      - name: 🔍 執行 CodeQL 分析
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

      - name: 🏗️ 建置應用程式 (OWASP ZAP 準備)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: pnpm run build
        continue-on-error: true

      - name: 🚀 啟動測試服務器 (OWASP ZAP)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        continue-on-error: true
        run: |
          # 啟動 Admin Dashboard
          cd apps/admin-dashboard && pnpm preview &
          echo $! > dashboard-server.pid

          # 啟動 API
          cd ../api && pnpm dev &
          echo $! > api-server.pid

          # 等待服務器啟動
          npx wait-on http://localhost:4173 --timeout 60000
          npx wait-on http://localhost:8787 --timeout 60000
        env:
          NODE_ENV: test

      - name: 🕷️ OWASP ZAP 動態安全掃描
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          # 賦予執行權限
          chmod +x tests/security/run-zap-scan.sh

          # 執行 ZAP 掃描
          TARGET_URL=http://localhost:4173 \
          API_URL=http://localhost:8787 \
          ZAP_CLEANUP=true \
          ./tests/security/run-zap-scan.sh
        continue-on-error: true

      - name: 🛑 停止測試服務器
        if: always() && (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
        run: |
          if [ -f dashboard-server.pid ]; then
            kill $(cat dashboard-server.pid) || true
            rm dashboard-server.pid
          fi
          if [ -f api-server.pid ]; then
            kill $(cat api-server.pid) || true
            rm api-server.pid
          fi

      - name: 📎 上傳安全測試報告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-test-reports
          path: |
            snyk-report.json
            security-reports/
            codeql-results/
          retention-days: 90

      - name: 📊 生成安全摘要報告
        if: always()
        run: |
          echo "## 🔐 安全性測試摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Snyk 報告
          if [ -f snyk-report.json ]; then
            echo "### 🛡️ Snyk 依賴掃描" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat snyk-report.json | jq '.vulnerabilities | group_by(.severity) | map({severity: .[0].severity, count: length})' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # ZAP 報告
          if [ -f security-reports/zap-alerts-*.json ]; then
            echo "### 🕷️ OWASP ZAP 動態掃描" >> $GITHUB_STEP_SUMMARY
            LATEST_ZAP=$(ls -t security-reports/zap-alerts-*.json | head -1)
            HIGH_COUNT=$(cat "$LATEST_ZAP" | jq '[.alerts[] | select(.risk=="High")] | length')
            MEDIUM_COUNT=$(cat "$LATEST_ZAP" | jq '[.alerts[] | select(.risk=="Medium")] | length')
            LOW_COUNT=$(cat "$LATEST_ZAP" | jq '[.alerts[] | select(.risk=="Low")] | length')

            echo "- 🔴 高風險: $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- 🟡 中風險: $MEDIUM_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- 🟢 低風險: $LOW_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "📋 完整報告請查看 Artifacts 區域" >> $GITHUB_STEP_SUMMARY

  # 測試結果彙總
  test-summary:
    name: 📊 測試結果彙總
    runs-on: ubuntu-latest
    needs:
      [
        unit-tests,
        workers-tests,
        real-integration-tests,
        e2e-tests,
        visual-regression-tests,
        security-tests,
        database-performance-tests,
        performance-tests,
      ]
    if: always()
    timeout-minutes: 5

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v5

      - name: 📥 下載測試結果
        uses: actions/download-artifact@v8
        with:
          path: test-artifacts

      - name: 📊 產生測試報告
        run: |
          echo "## 🧪 MakanMakan 測試結果完整摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**觸發事件**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 核心測試
          echo "### 🎯 核心測試" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "- ✅ 單元測試: 通過" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.unit-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ 單元測試: 跳過" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ 單元測試: 失敗" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.workers-tests.result }}" == "success" ]; then
            echo "- ✅ Workers 測試: 通過" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.workers-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ Workers 測試: 跳過" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Workers 測試: 失敗" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.real-integration-tests.result }}" == "success" ]; then
            echo "- ✅ Real integration 測試: 通過" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.real-integration-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ Real integration 測試: 跳過" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Real integration 測試: 失敗" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "- ✅ E2E 測試: 通過" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.e2e-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ E2E 測試: 跳過" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ E2E 測試: 失敗" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # 性能測試
          echo "### 🚀 性能與負載測試" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.performance-tests.result }}" == "success" ]; then
            echo "- ✅ API/WebSocket 負載測試: 通過" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.performance-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ API/WebSocket 負載測試: 跳過" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ API/WebSocket 負載測試: 失敗" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.database-performance-tests.result }}" == "success" ]; then
            echo "- ✅ 資料庫性能測試: 通過" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.database-performance-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ 資料庫性能測試: 跳過" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ 資料庫性能測試: 失敗" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # 視覺與品質測試
          echo "### 👁️ 視覺回歸與品質保證" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.visual-regression-tests.result }}" == "success" ]; then
            echo "- ✅ 視覺回歸測試 (Chromatic/Percy): 通過" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.visual-regression-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ 視覺回歸測試: 跳過" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ 視覺回歸測試: 失敗" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # 安全性測試
          echo "### 🔐 安全性掃描" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.security-tests.result }}" == "success" ]; then
            echo "- ✅ 安全性測試 (Snyk + OWASP ZAP + CodeQL): 通過" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.security-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ 安全性測試: 跳過" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ 安全性測試: 失敗" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 整體狀態判斷
          OVERALL_STATUS="success"

          if [ "${{ needs.unit-tests.result }}" != "success" ] && [ "${{ needs.unit-tests.result }}" != "skipped" ]; then
            OVERALL_STATUS="failure"
          fi
          if [ "${{ needs.workers-tests.result }}" != "success" ] && [ "${{ needs.workers-tests.result }}" != "skipped" ]; then
            OVERALL_STATUS="failure"
          fi
          if [ "${{ needs.real-integration-tests.result }}" != "success" ] && [ "${{ needs.real-integration-tests.result }}" != "skipped" ]; then
            OVERALL_STATUS="failure"
          fi
          if [ "${{ needs.e2e-tests.result }}" != "success" ] && [ "${{ needs.e2e-tests.result }}" != "skipped" ]; then
            OVERALL_STATUS="failure"
          fi
          if [ "${{ needs.security-tests.result }}" != "success" ] && [ "${{ needs.security-tests.result }}" != "skipped" ]; then
            OVERALL_STATUS="failure"
          fi

          if [ "$OVERALL_STATUS" == "success" ]; then
            echo "### ✅ 整體狀態: 所有測試通過" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 **所有關鍵測試均已通過，系統可以安全部署！**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ 整體狀態: 部分測試失敗" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **請檢查失敗的測試項目，修復後再進行部署。**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📎 **完整測試報告和截圖請查看 Artifacts 區域**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 測試涵蓋範圍:" >> $GITHUB_STEP_SUMMARY
          echo "- 程式碼品質 (ESLint, TypeScript, Prettier)" >> $GITHUB_STEP_SUMMARY
          echo "- 單元測試 + 覆蓋率報告" >> $GITHUB_STEP_SUMMARY
          echo "- Cloudflare Workers 整合測試" >> $GITHUB_STEP_SUMMARY
          echo "- Real integration 測試 (miniflare D1)" >> $GITHUB_STEP_SUMMARY
          echo "- E2E 測試 (Chromium, Firefox, WebKit)" >> $GITHUB_STEP_SUMMARY
          echo "- API/WebSocket 負載測試 (Artillery)" >> $GITHUB_STEP_SUMMARY
          echo "- 資料庫性能基準與退化檢測" >> $GITHUB_STEP_SUMMARY
          echo "- 視覺回歸測試 (Chromatic/Percy)" >> $GITHUB_STEP_SUMMARY
          echo "- 深度安全掃描 (Snyk + OWASP ZAP + CodeQL)" >> $GITHUB_STEP_SUMMARY

  # 部署到測試環境 (僅在所有測試通過時)
  deploy-staging:
    name: 🚀 部署到測試環境
    runs-on: ubuntu-latest
    needs:
      [
        unit-tests,
        workers-tests,
        real-integration-tests,
        e2e-tests,
        security-tests,
        visual-regression-tests,
      ]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    timeout-minutes: 20

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v5

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@v5

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置應用程式
        run: pnpm run build

      - name: 🚀 部署到 Cloudflare (Staging)
        run: pnpm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🧪 部署後煙霧測試
        run: pnpm run test:smoke:staging
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
