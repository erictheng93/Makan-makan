name: 🧪 MakanMakan 測試流水線

on:
  # Auto-trigger restored 2026-04-24 after the perf wins from commit 83b7b6c1
  # were validated in nightly-integration runs. Heavy jobs (e2e, perf, security,
  # visual regression) remain gated to push-on-main/develop or workflow_dispatch
  # via per-job `if:` guards, so PR feedback stays fast (~lint+typecheck+unit+
  # workers+real-integration only).
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-flight runs on the same PR when a new commit lands so reviewers
# only see the latest result; on push to main/develop never cancel because
# we want main's history to record every commit's status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: "22"

jobs:
  # 程式碼品質檢查
  lint-and-typecheck:
    name: 📝 程式碼檢查
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v7

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@v6

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🔍 ESLint 檢查
        run: pnpm run lint

      - name: 🧼 確認 lint 沒有修改檔案
        run: git diff --exit-code

      - name: 🎯 TypeScript 型別檢查
        run: pnpm run typecheck

      - name: 🌐 i18n locale coverage warning
        run: pnpm run check:i18n-locales

      - name: 💅 Prettier 格式檢查
        run: pnpm exec prettier --check "**/*.{ts,js,vue,json,md}"

      - name: 🔒 整合測試白名單檢查
        run: node scripts/check-integration-allowlist.cjs

      - name: 🚦 Production config 檢查
        run: pnpm run check:prod-config
        env:
          CHECK_PRODUCTION_CONFIG_REQUIRE_DEPLOYMENT_SECRETS: "false"

      - name: 🧭 Migration dual-track guard
        run: pnpm run check:migration-dual-track

  # 單元測試
  unit-tests:
    name: 🧪 單元測試
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v7

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@v6

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置內部套件
        run: pnpm run build

      - name: 🧪 執行所有單元測試
        run: pnpm exec vitest run

      - name: 📊 產生覆蓋率報告
        # Coverage only runs on push events (main/develop/workflow_dispatch).
        # PR runs skip this to keep feedback fast — vitest already ran once
        # above for correctness.
        if: github.event_name != 'pull_request'
        run: pnpm exec vitest run --coverage

      - name: ☂️ 上傳覆蓋率到 Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unit-tests
          name: unit-tests

      - name: 📎 上傳測試結果
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  # Real integration 測試 (miniflare D1 + 真 drizzle)
  #
  # Runs app test files that need real API/DB boundaries via each app's
  # vitest.real-integration.config.ts. These configs serialise files
  # (fileParallelism: false, maxWorkers: 1) because Miniflare/workerd IPC and
  # real D1 setup fail under parallel boot pressure. The default vitest config's
  # shorter timeout and broad parallelism are too tight for these tests.
  #
  # Before this job existed, these tests either flaked in unit-tests
  # (when named *.test.ts) or ran nowhere (when named
  # *.real.integration.test.ts, excluded from the default config but
  # never invoked in CI).
  #
  real-integration-tests:
    name: 🗄️ Real Integration 測試
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 25

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v7

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@v6

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置內部套件
        run: pnpm --filter @makanmakan/api^... build

      - name: 🗄️ 執行 real-integration 測試
        run: pnpm test:real-integration

  # E2E 測試 (mock API — no real backend needed)
  #
  # All customer/journey tests use page.route() mocks from
  # tests/e2e/helpers/mock-api.ts to intercept API calls. Admin tests
  # use preAuthAdmin() + mock routes. Integration tests (real API) are
  # excluded — they require a live backend and should run in nightly CI.
  #
  # Runs inside the pinned Playwright Linux container so browser binaries
  # and system dependencies are pre-installed. Upgrading Playwright
  # requires bumping BOTH the image tag below AND the @playwright/test
  # version in package.json in the same PR.
  e2e-tests:
    name: 🎭 E2E 測試
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v7

      - name: 📦 啟用 pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置 customer-app + admin-dashboard + kitchen-display
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          pnpm build \
            --filter=makanmasak-customer-app \
            --filter=makanmasak-admin-dashboard \
            --filter=makanmasak-kitchen-display

      - name: 🚀 啟動 preview servers
        run: |
          mkdir -p /tmp/preview-logs
          (cd apps/customer-app    && pnpm exec vite preview --port 3000 --host 0.0.0.0 > /tmp/preview-logs/customer.log 2>&1 &)
          (cd apps/admin-dashboard && pnpm exec vite preview --port 3001 --host 0.0.0.0 > /tmp/preview-logs/admin.log    2>&1 &)
          (cd apps/kitchen-display && pnpm exec vite preview --port 3002 --host 0.0.0.0 > /tmp/preview-logs/kitchen.log  2>&1 &)

      - name: ⏳ 等待 preview servers 就緒
        run: |
          if ! node <<'NODE'
          (async () => {
          const urls = [
            "http://localhost:3000",
            "http://localhost:3001",
            "http://localhost:3002",
          ];
          const deadline = Date.now() + 60_000;

          for (;;) {
            const pending = [];

            for (const url of urls) {
              try {
                const response = await fetch(url);
                if (!response.ok) pending.push(`${url} -> ${response.status}`);
              } catch (error) {
                pending.push(`${url} -> ${error.cause?.code ?? error.message}`);
              }
            }

            if (pending.length === 0) {
              console.log(`Preview servers ready: ${urls.join(", ")}`);
              process.exit(0);
            }

            if (Date.now() >= deadline) {
              console.error(`Timed out waiting for preview servers:`);
              for (const item of pending) console.error(`- ${item}`);
              process.exit(1);
            }

            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          })();
          NODE
          then
            echo "customer preview log:"
            cat /tmp/preview-logs/customer.log || true
            echo "admin preview log:"
            cat /tmp/preview-logs/admin.log || true
            echo "kitchen preview log:"
            cat /tmp/preview-logs/kitchen.log || true
            exit 1
          fi

      - name: 🧪 執行 E2E 測試
        # Pushes run a small preview smoke because the full Chromium/Admin E2E
        # suite is currently too large and flaky for fast-feedback CI.
        # Manual dispatch keeps the full suite available for investigation.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm exec playwright test --project=chromium --project=admin
          else
            pnpm exec playwright test --config playwright.ci-smoke.config.ts
          fi
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_URL: http://localhost:3001
          E2E_KITCHEN_URL: http://localhost:3002

      - name: 🛑 停止測試服務器
        if: always()
        run: |
          pkill -f "vite preview" || true

      - name: 📎 上傳測試報告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

      - name: 📸 上傳測試截圖
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots-e2e
          path: test-results/
          retention-days: 7

  # 測試結果彙總
  test-summary:
    name: 📊 測試結果彙總
    runs-on: ubuntu-latest
    needs: [unit-tests, real-integration-tests, e2e-tests]
    if: always() && github.event_name != 'pull_request'
    timeout-minutes: 5

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@v7

      - name: 📥 下載測試結果
        uses: actions/download-artifact@v8
        with:
          path: test-artifacts

      - name: 📊 產生測試報告
        run: |
          echo "## 🧪 MakanMakan 測試結果完整摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**觸發事件**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 核心測試
          echo "### 🎯 核心測試" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "- ✅ 單元測試: 通過" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.unit-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ 單元測試: 跳過" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ 單元測試: 失敗" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.real-integration-tests.result }}" == "success" ]; then
            echo "- ✅ Real integration 測試: 通過" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.real-integration-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ Real integration 測試: 跳過" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Real integration 測試: 失敗" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "- ✅ E2E 測試: 通過" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.e2e-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ E2E 測試: 跳過" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ E2E 測試: 失敗" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 整體狀態判斷
          OVERALL_STATUS="success"

          if [ "${{ needs.unit-tests.result }}" != "success" ] && [ "${{ needs.unit-tests.result }}" != "skipped" ]; then
            OVERALL_STATUS="failure"
          fi
          if [ "${{ needs.real-integration-tests.result }}" != "success" ] && [ "${{ needs.real-integration-tests.result }}" != "skipped" ]; then
            OVERALL_STATUS="failure"
          fi
          if [ "${{ needs.e2e-tests.result }}" != "success" ] && [ "${{ needs.e2e-tests.result }}" != "skipped" ]; then
            OVERALL_STATUS="failure"
          fi

          if [ "$OVERALL_STATUS" == "success" ]; then
            echo "### ✅ 整體狀態: 所有測試通過" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 **所有關鍵測試均已通過，系統可以安全部署！**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ 整體狀態: 部分測試失敗" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **請檢查失敗的測試項目，修復後再進行部署。**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📎 **完整測試報告和截圖請查看 Artifacts 區域**" >> $GITHUB_STEP_SUMMARY
