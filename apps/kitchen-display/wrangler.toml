name = "makanmasak-kitchen"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables for kitchen display
[vars]
VITE_API_BASE_URL = "http://localhost:8787/api/v1"
VITE_NODE_ENV = "development"

[env.production]
name = "makanmasak-kitchen-prod"
pages_build_output_dir = "dist"
pages_build_command = "npm run build"
vars = { 
  VITE_API_BASE_URL = "https://api.makanmasak.com/api/v1",
  VITE_NODE_ENV = "production"
}

[env.staging]
name = "makanmasak-kitchen-staging"
pages_build_output_dir = "dist"
pages_build_command = "npm run build"
vars = { 
  VITE_API_BASE_URL = "https://api-staging.makanmasak.com/api/v1",
  VITE_NODE_ENV = "staging"
}