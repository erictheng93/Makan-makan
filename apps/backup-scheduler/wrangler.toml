# MakanMasak Backup Scheduler - Cloudflare Workers Configuration
# Automated backup scheduling and system monitoring

name = "makanmasak-backup-scheduler"
main = "../../apps/api/src/workers/backup-scheduler.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cron Triggers for automated scheduling
#
# Deliberately empty. Backups here are a per-restaurant product feature: the
# scheduler reads backup_configurations WHERE schedule_enabled = true, and
# production has none, so every one of these ran against an empty set. The
# */5 health check was the worst of it -- 8,640 runs a month monitoring a
# backup system that had never stored an object.
#
# This is NOT the platform's disaster recovery. That is D1 Time Travel, which
# is enabled on makanmasak-prod and independent of this Worker.
#
# Restore the schedules below when a tenant actually enables a backup
# configuration. An empty array is what clears the triggers on deploy;
# deleting the block would leave the existing ones running.
[triggers]
crons = []
# "*/5 * * * *"    # Every 5 minutes - Health checks and monitoring
# "0 */6 * * *"    # Every 6 hours - Process scheduled backups
# "0 2 * * *"      # Daily at 2 AM - Cleanup and maintenance
# "0 0 * * SUN"    # Weekly on Sunday - Generate reports and alerts

# Default variables for development
[vars]
NODE_ENV = "development"
LOG_LEVEL = "debug"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "makanmakan-local"
database_id = "local"

# KV namespace for backup metadata
[[kv_namespaces]]
binding = "BACKUP_KV"
id = "makanmasak-backup-dev"

# R2 bucket for backup storage
[[r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmasak-backups-dev"

# Analytics for monitoring
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "makanmasak-backup-metrics-dev"

# === DEVELOPMENT ENVIRONMENT ===
[env.development]
name = "makanmasak-backup-scheduler-dev"
[env.development.vars]
NODE_ENV = "development"
LOG_LEVEL = "debug"

[[env.development.d1_databases]]
binding = "DB"
database_name = "makanmakan-local"
database_id = "local"

[[env.development.kv_namespaces]]
binding = "BACKUP_KV"
id = "makanmasak-backup-dev"

[[env.development.r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmasak-backups-dev"

[[env.development.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "makanmasak-backup-metrics-dev"

# === PRODUCTION ENVIRONMENT ===
[env.production]
name = "makanmasak-backup-scheduler-prod"
[env.production.vars]
NODE_ENV = "production"
LOG_LEVEL = "warn"

[[env.production.d1_databases]]
binding = "DB"
database_name = "makanmasak-prod"
database_id = "4e3c7ba8-5aa7-4652-bfea-a9c565b3a141"

[[env.production.kv_namespaces]]
binding = "BACKUP_KV"
id = "0f091e2ecc254832b824794e6d6912dc"

[[env.production.r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmasak-backups-prod"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "makanmasak-backup-metrics-prod"

# Smart placement for production
[env.production.placement]
mode = "smart"
