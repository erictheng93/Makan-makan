name = "makanmasak-admin"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Environment variables for frontend apps
[vars]
VITE_API_BASE_URL = "http://localhost:8787/api/v1"
VITE_API_URL = "http://localhost:8787/api/v1"
VITE_REALTIME_WS_URL = "ws://localhost:8788"
VITE_KITCHEN_DISPLAY_URL = "http://localhost:3002"
VITE_NODE_ENV = "development"

[env.production]
name = "makanmasak-admin"

[env.production.vars]
VITE_API_BASE_URL = "https://api.makanmasak.com/api/v1"
VITE_API_URL = "https://api.makanmasak.com/api/v1"
VITE_REALTIME_WS_URL = "wss://realtime.makanmasak.com"
VITE_KITCHEN_DISPLAY_URL = "https://kitchen.makanmasak.com"
VITE_NODE_ENV = "production"

[env.preview]
name = "makanmasak-admin-staging"

[env.preview.vars]
VITE_API_BASE_URL = "https://makanmasak-api-staging.omfg.workers.dev/api/v1"
VITE_API_URL = "https://makanmasak-api-staging.omfg.workers.dev/api/v1"
VITE_REALTIME_WS_URL = "wss://makanmasak-realtime-staging.omfg.workers.dev"
VITE_KITCHEN_DISPLAY_URL = "https://makanmasak-kitchen-staging.pages.dev"
VITE_NODE_ENV = "staging"
