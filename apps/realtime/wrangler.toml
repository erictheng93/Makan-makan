name = "makanmakan-realtime"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Development server configuration
[dev]
port = 8788
local_protocol = "http"

[durable_objects]
bindings = [
  { name = "REALTIME_SESSION", class_name = "RealtimeSession" }
]

[[migrations]]
tag = "v1"
new_classes = ["RealtimeSession"]

# === STAGING ENVIRONMENT ===
[env.staging]
name = "makanmakan-realtime-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "makanmakan-staging"
# TODO: Replace with actual D1 database ID from Cloudflare dashboard
# Run: wrangler d1 create makanmakan-staging
database_id = "STAGING_DB_ID_TO_BE_REPLACED"

# Cache KV - aligned with API naming convention
[[env.staging.kv_namespaces]]
binding = "CACHE_KV"
# Use same KV namespace as API for data consistency
id = "makanmakan-cache-staging"

# Token Blacklist KV - dedicated security namespace
[[env.staging.kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "makanmakan-token-blacklist-staging"

# Rate Limit KV - for WebSocket connection rate limiting
[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "makanmakan-ratelimit-staging"

# === PRODUCTION ENVIRONMENT ===
[env.production]
name = "makanmakan-realtime-prod"

[[env.production.d1_databases]]
binding = "DB"
database_name = "makanmakan-prod"
# TODO: Replace with actual D1 database ID from Cloudflare dashboard
# Run: wrangler d1 create makanmakan-prod
database_id = "PRODUCTION_DB_ID_TO_BE_REPLACED"

# Cache KV - aligned with API naming convention
[[env.production.kv_namespaces]]
binding = "CACHE_KV"
# Use same KV namespace as API for data consistency
id = "makanmakan-cache-prod"

# Token Blacklist KV - dedicated security namespace
[[env.production.kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "makanmakan-token-blacklist-prod"

# Rate Limit KV - for WebSocket connection rate limiting
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "makanmakan-ratelimit-prod"

# Smart placement for production
[env.production.placement]
mode = "smart"
strategy = "closest"
hints = ["asia-southeast1"]
