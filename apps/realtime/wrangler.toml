name = "makanmasak-realtime"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Development server configuration
[dev]
port = 8788
local_protocol = "http"
# inspector_port intentionally omitted: pinning it in wrangler.toml triggers
# "*** std::terminate() called" in workerd on Windows (wrangler 4.84.1).
# Let wrangler auto-allocate instead.

[vars]
ENVIRONMENT = "development"
API_VERSION = "v1"
CORS_ORIGIN = "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:5173,http://localhost:8000,http://localhost:8787"
RATE_LIMIT_ENABLED = "false"

[durable_objects]
bindings = [
  { name = "REALTIME_SESSION", class_name = "RealtimeSession" }
]

# legacy-kv, not SQLite — this is a declaration of what is already
# provisioned, not a choice. RealtimeSession was created by the 2026-07-22
# production deploy, when this file still said `new_classes`, so the live
# namespace on makanmasak-realtime-prod is key-value backed. Cloudflare cannot
# change a deployed class's storage backend in place: `new_sqlite_classes` on an
# existing key-value class is rejected, and the `exports` reconciler fails it as
# `storage_type_mismatch`. The worker is already past `tag = "v1"`, so this
# entry is history — wrangler sends no migration for it — and rewriting it does
# not move the backend, it only makes the file disagree with production.
#
# The cost argument for SQLite is real (4 KB request units vs whole rows, and a
# free tier 50x larger for writes) but it is not reachable from here. Revisit
# when Cloudflare ships the key-value → SQLite migration path they have
# promised; until then the lever is addToEventHistory's full-array rewrite.
[[migrations]]
tag = "v1"
new_classes = ["RealtimeSession"]

# Local D1 binding — RealtimeSession DurableObject's
# validateRestaurantAccess() needs to query users.restaurant_id to confirm
# that staff/admin connecting to a room actually belong to the restaurant.
# Without this binding `this.env.DB` is undefined in dev and every
# admin/kitchen WS upgrade fails. Same shape as apps/api/wrangler.toml.
[[d1_databases]]
binding = "DB"
database_name = "makanmakan-local"
database_id = "local"
migrations_dir = "../../packages/database/migrations_fresh"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "makanmasak-cache-dev"
preview_id = "makanmasak-cache-preview"

[[kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "makanmasak-token-blacklist-dev"
preview_id = "makanmasak-token-blacklist-preview"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "makanmasak-ratelimit-dev"
preview_id = "makanmasak-ratelimit-preview"

# === PRODUCTION ENVIRONMENT ===
[env.production]
name = "makanmasak-realtime-prod"

[env.production.vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
CORS_ORIGIN = "https://makanmasak.com,https://customer.makanmasak.com,https://admin.makanmasak.com,https://kitchen.makanmasak.com"
RATE_LIMIT_ENABLED = "true"

# Custom domain — wrangler provisions DNS + SSL automatically on deploy
# since the makanmasak.com zone is already on this Cloudflare account.
[[env.production.routes]]
pattern = "realtime.makanmasak.com"
custom_domain = true

[env.production.durable_objects]
bindings = [
  { name = "REALTIME_SESSION", class_name = "RealtimeSession" }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "makanmasak-prod"
# TODO: Replace with actual D1 database ID from Cloudflare dashboard
# Run: wrangler d1 create makanmasak-prod
database_id = "4e3c7ba8-5aa7-4652-bfea-a9c565b3a141"

# Cache KV - aligned with API naming convention
[[env.production.kv_namespaces]]
binding = "CACHE_KV"
# Use same KV namespace as API for data consistency
id = "5850dad46b684f2d8b69b3344d146a1d"

# Token Blacklist KV - dedicated security namespace
[[env.production.kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "30ba7daf1e4c41438233542de10dd02f"

# Rate Limit KV - for WebSocket connection rate limiting
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "e442a551aa3f484db44fcdfa1084ff81"

