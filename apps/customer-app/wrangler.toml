name = "makanmasak-customer"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Environment variables for customer app
[vars]
VITE_API_BASE_URL = "http://localhost:8787/api/v1"
VITE_WS_BASE_URL = "ws://localhost:8787"
VITE_REALTIME_URL = "ws://localhost:8787"
VITE_REALTIME_WS_URL = "ws://localhost:8787"
VITE_NODE_ENV = "development"

[env.production]
name = "makanmasak-customer"

[env.production.vars]
VITE_API_BASE_URL = "https://api.makanmasak.com/api/v1"
VITE_WS_BASE_URL = "wss://api.makanmasak.com"
VITE_REALTIME_URL = "wss://realtime.makanmasak.com"
VITE_REALTIME_WS_URL = "wss://realtime.makanmasak.com"
VITE_MAP_PM_TILES_URL = "https://pub-2c3683e1158d4d579317f24fc66a34b3.r2.dev/taiwan.pmtiles"
VITE_MAP_GLYPHS_URL = "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf"
VITE_NODE_ENV = "production"
