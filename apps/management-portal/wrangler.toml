# Management Portal - Cloudflare Pages Configuration
# 管理後台 Vue.js 應用

name = "makanmakan-management-portal"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# 環境變數
[vars]
VITE_MANAGEMENT_API_URL = "https://manage-api.makanmakan.app/api/v1"

# Staging 環境
[env.staging]
name = "makanmakan-management-staging"

[env.staging.vars]
VITE_MANAGEMENT_API_URL = "https://manage-api-staging.makanmakan.app/api/v1"

# Production 環境
[env.production]
name = "makanmakan-management"

[env.production.vars]
VITE_MANAGEMENT_API_URL = "https://manage-api.makanmakan.app/api/v1"
