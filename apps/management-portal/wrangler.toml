# Management Portal - Cloudflare Pages Configuration
# 管理後台 Vue.js 應用

name = "makanmasak-management-portal"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# 環境變數
[vars]
VITE_MANAGEMENT_API_URL = "https://manage-api.makanmasak.com/api/v1"

# Preview/Staging 環境
[env.preview]
name = "makanmasak-management-staging"

[env.preview.vars]
VITE_MANAGEMENT_API_URL = "https://makanmasak-management-api-staging.omfg.workers.dev/api/v1"

# Production 環境
[env.production]
name = "makanmasak-management"

[env.production.vars]
VITE_MANAGEMENT_API_URL = "https://manage-api.makanmasak.com/api/v1"
