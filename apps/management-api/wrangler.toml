# MakanMakan Management API - Cloudflare Workers Configuration
# Central management platform for hybrid deployment strategy

name = "makanmasak-management-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Development server configuration
[dev]
port = 8789
local_protocol = "http"
# inspector_port intentionally omitted: pinning it in wrangler.toml triggers
# "*** std::terminate() called" in workerd on Windows (wrangler 4.84.1).
# Let wrangler auto-allocate instead.

# Default variables for development
[vars]
NODE_ENV = "development"
API_VERSION = "v1"
API_BASE_URL = "http://localhost:8789"
CORS_ORIGIN = "*"
LOG_LEVEL = "debug"

# D1 Database binding (management database)
[[d1_databases]]
binding = "MANAGEMENT_DB"
database_name = "makanmakan-management-local"
database_id = "local"
migrations_dir = "migrations"

# KV namespace for caching
[[kv_namespaces]]
binding = "CACHE_KV"
id = "makanmasak-management-cache-dev"
preview_id = "makanmasak-management-cache-preview"

# KV namespace for deployment status tracking
[[kv_namespaces]]
binding = "DEPLOYMENT_STATUS_KV"
id = "makanmasak-deployment-status-dev"
preview_id = "makanmasak-deployment-status-preview"

# R2 bucket for worker bundles
[[r2_buckets]]
binding = "BUNDLE_STORAGE"
bucket_name = "makanmasak-management-bundles-dev"
preview_bucket_name = "makanmasak-management-bundles-preview"

# === STAGING ENVIRONMENT ===
[env.staging]
name = "makanmasak-management-api-staging"
[env.staging.vars]
NODE_ENV = "staging"
API_VERSION = "v1"
API_BASE_URL = "https://manage-staging.makanmasak.com"
CORS_ORIGIN = "https://admin-staging.makanmasak.com"
LOG_LEVEL = "info"

[[env.staging.d1_databases]]
binding = "MANAGEMENT_DB"
database_name = "makanmasak-management-staging"
database_id = "ad9fc277-ec03-4092-af74-88571f2767a0"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "CACHE_KV"
id = "9d6145956f874d56b700488562466af0"

[[env.staging.kv_namespaces]]
binding = "DEPLOYMENT_STATUS_KV"
id = "9ba6e6d8a66f440fbe0aaadc54b53017"

[[env.staging.r2_buckets]]
binding = "BUNDLE_STORAGE"
bucket_name = "makanmasak-management-bundles-staging"

# === PRODUCTION ENVIRONMENT ===
[env.production]
name = "makanmasak-management-api-prod"
[env.production.vars]
NODE_ENV = "production"
API_VERSION = "v1"
API_BASE_URL = "https://manage.makanmasak.com"
CORS_ORIGIN = "https://admin.makanmasak.com"
LOG_LEVEL = "warn"

[[env.production.d1_databases]]
binding = "MANAGEMENT_DB"
database_name = "makanmasak-management-prod"
database_id = "REPLACE_ME__PRODUCTION__MGMT_DB"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_ME__PRODUCTION__MGMT_CACHE_KV"

[[env.production.kv_namespaces]]
binding = "DEPLOYMENT_STATUS_KV"
id = "REPLACE_ME__PRODUCTION__MGMT_DEPLOY_STATUS_KV"

[[env.production.r2_buckets]]
binding = "BUNDLE_STORAGE"
bucket_name = "makanmasak-management-bundles-prod"

# Smart placement for production
[env.production.placement]
mode = "smart"

# Secrets (set via wrangler secret put):
# - JWT_SECRET: JWT signing secret for management tokens
# - ENCRYPTION_KEY: For encrypting stored API tokens
# - CF_API_TOKEN: Cloudflare API token for resource provisioning
# - CF_ACCOUNT_ID: Main Cloudflare account ID
