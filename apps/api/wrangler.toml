# MakanMakan API - Cloudflare Workers Configuration
# Updated to use latest wrangler 4.35.0

name = "makanmasak-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Development server configuration
[dev]
port = 8787
local_protocol = "http"
# inspector_port intentionally omitted: pinning it in wrangler.toml triggers
# "*** std::terminate() called" in workerd on Windows (wrangler 4.84.1).
# Let wrangler auto-allocate instead.

# Default variables for development
[vars]
NODE_ENV = "development"
API_VERSION = "v1"
API_BASE_URL = "http://localhost:8787"
CORS_ORIGIN = "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3010,http://localhost:3011"
LOG_LEVEL = "info"
REALTIME_WS_URL = "ws://localhost:8788"
DISCOVERY_EMBEDDING_MODEL = "@cf/baai/bge-m3"

# ===== Deployment Mode Configuration =====
# DEPLOYMENT_MODE: 'saas' (default) or 'independent'
# - saas: Multi-tenant centralized platform (default for development)
# - independent: Single-tenant managed deployment
DEPLOYMENT_MODE = "saas"
# For independent deployments, set these additional variables:
# TENANT_ID = "S-YYYYMMDD-NNN"           # Unique tenant identifier
# TENANT_NAME = "餐廳名稱"                # Display name
# LICENSE_KEY = "MKM-PRO-XXXXXX-XXXX"    # License key
# CENTRAL_API_URL = "https://manage.makanmasak.com"
# PLATFORM_VERSION = "1.0.0"

# JWT_SECRET - SECURITY: Use `wrangler secret put JWT_SECRET` instead of hardcoding
# For local development, set via environment variable or use a local .dev.vars file

# Notification Provider Configuration
# SECURITY: API keys should be set via `wrangler secret put` command
# Email provider (Resend)
NOTIFICATION_FROM_EMAIL = "notifications@makanmasak.com"
# RESEND_API_KEY - Set via: wrangler secret put RESEND_API_KEY
# SMS provider (Twilio)
# TWILIO_ACCOUNT_SID - Set via: wrangler secret put TWILIO_ACCOUNT_SID
# TWILIO_AUTH_TOKEN - Set via: wrangler secret put TWILIO_AUTH_TOKEN
TWILIO_PHONE_NUMBER = "+1234567890"  # Update with actual number

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "makanmakan-local"
database_id = "local"
migrations_dir = "../../packages/database/migrations_fresh"

[[services]]
binding = "MANAGEMENT_API"
service = "makanmasak-management-api"

# KV namespaces for caching and rate limiting
[[kv_namespaces]]
binding = "CACHE_KV"
id = "makanmasak-cache-dev"
preview_id = "makanmasak-cache-preview"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "makanmasak-ratelimit-dev"
preview_id = "makanmasak-ratelimit-preview"

[[kv_namespaces]]
binding = "BACKUP_KV"
id = "makanmasak-backup-dev"
preview_id = "makanmasak-backup-preview"

# R2 bucket for backup storage
[[r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmasak-backups-dev"
preview_bucket_name = "makanmasak-backups-preview"

# Durable Object binding to apps/realtime — needed for RealtimeBroadcastService.
# Without this, env.REALTIME_SESSION is undefined and broadcasts silently no-op
# (see tasks/incidents/INC-001). Each env points at the matching realtime worker.
[[durable_objects.bindings]]
name = "REALTIME_SESSION"
class_name = "RealtimeSession"
script_name = "makanmasak-realtime"

# Search-index fan-out queue (this worker is both producer and consumer).
# Create once with: wrangler queues create makanmasak-search-sync-dev
#                   wrangler queues create makanmasak-search-sync-dlq-dev
[[queues.producers]]
binding = "SEARCH_SYNC_QUEUE"
queue = "makanmasak-search-sync-dev"

[[queues.consumers]]
queue = "makanmasak-search-sync-dev"
max_batch_size = 25
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "makanmasak-search-sync-dlq-dev"

[ai]
binding = "AI"

[[vectorize]]
binding = "DISCOVERY_VECTORIZE"
index_name = "makanmasak-discovery-dev"

# === DEVELOPMENT ENVIRONMENT ===
[env.development]
name = "makanmasak-api-dev"
[env.development.vars]
NODE_ENV = "development"
API_VERSION = "v1"
API_BASE_URL = "http://localhost:8787"
CORS_ORIGIN = "*"
LOG_LEVEL = "debug"
MAX_REQUEST_SIZE = "50MB"
CACHE_TTL = "60"
RATE_LIMIT_REQUESTS = "1000"
DEPLOYMENT_MODE = "saas"
PLATFORM_VERSION = "1.0.0"
REALTIME_WS_URL = "ws://localhost:8788"
DISCOVERY_EMBEDDING_MODEL = "@cf/baai/bge-m3"
# Notification configuration
NOTIFICATION_FROM_EMAIL = "dev-notifications@makanmasak.com"
TWILIO_PHONE_NUMBER = "+1234567890"

[[env.development.d1_databases]]
binding = "DB"
database_name = "makanmakan-local"
database_id = "local"

[[env.development.services]]
binding = "MANAGEMENT_API"
service = "makanmasak-management-api"

[[env.development.kv_namespaces]]
binding = "CACHE_KV"
id = "makanmasak-cache-dev"

[[env.development.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "makanmasak-ratelimit-dev"

[[env.development.kv_namespaces]]
binding = "BACKUP_KV"
id = "makanmasak-backup-dev"

[[env.development.r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmasak-backups-dev"

[[env.development.durable_objects.bindings]]
name = "REALTIME_SESSION"
class_name = "RealtimeSession"
script_name = "makanmasak-realtime"

[[env.development.queues.producers]]
binding = "SEARCH_SYNC_QUEUE"
queue = "makanmasak-search-sync-dev"

[[env.development.queues.consumers]]
queue = "makanmasak-search-sync-dev"
max_batch_size = 25
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "makanmasak-search-sync-dlq-dev"

[env.development.ai]
binding = "AI"

[[env.development.vectorize]]
binding = "DISCOVERY_VECTORIZE"
index_name = "makanmasak-discovery-dev"

# === PRODUCTION ENVIRONMENT ===
[env.production]
name = "makanmasak-api-prod"
[env.production.vars]
NODE_ENV = "production"
API_VERSION = "v1"
API_BASE_URL = "https://api.makanmasak.com"
CORS_ORIGIN = "https://makanmasak.com,https://admin.makanmasak.com"
LOG_LEVEL = "warn"
MAX_REQUEST_SIZE = "5MB"
CACHE_TTL = "600"
RATE_LIMIT_REQUESTS = "100"
DEPLOYMENT_MODE = "saas"
PLATFORM_VERSION = "1.0.0"
CENTRAL_API_URL = "https://manage-api.makanmasak.com"
REALTIME_WS_URL = "wss://realtime.makanmasak.com"
DISCOVERY_EMBEDDING_MODEL = "@cf/baai/bge-m3"
QUOTA_ENFORCEMENT_MODE = "enforce"
# Notification configuration
NOTIFICATION_FROM_EMAIL = "notifications@makanmasak.com"
TWILIO_PHONE_NUMBER = "+1234567890"

# Custom domain — wrangler provisions DNS + SSL automatically on deploy
# since the makanmasak.com zone is already on this Cloudflare account.
[[env.production.routes]]
pattern = "api.makanmasak.com"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "makanmasak-prod"
database_id = "4e3c7ba8-5aa7-4652-bfea-a9c565b3a141"
migrations_dir = "../../packages/database/migrations_fresh"

[[env.production.services]]
binding = "MANAGEMENT_API"
service = "makanmasak-management-api-prod"

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "5850dad46b684f2d8b69b3344d146a1d"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "e442a551aa3f484db44fcdfa1084ff81"

[[env.production.ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "1001"

  [env.production.ratelimits.simple]
  limit = 100
  period = 60

[[env.production.kv_namespaces]]
binding = "BACKUP_KV"
id = "0f091e2ecc254832b824794e6d6912dc"

# Token Blacklist KV for WebSocket authentication security
[[env.production.kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "30ba7daf1e4c41438233542de10dd02f"

[[env.production.r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmasak-backups-prod"

[[env.production.durable_objects.bindings]]
name = "REALTIME_SESSION"
class_name = "RealtimeSession"
script_name = "makanmasak-realtime-prod"

[[env.production.queues.producers]]
binding = "SEARCH_SYNC_QUEUE"
queue = "makanmasak-search-sync-prod"

[[env.production.queues.consumers]]
queue = "makanmasak-search-sync-prod"
max_batch_size = 25
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "makanmasak-search-sync-dlq-prod"

[env.production.ai]
binding = "AI"

[[env.production.vectorize]]
binding = "DISCOVERY_VECTORIZE"
index_name = "makanmasak-discovery-prod"

# Smart placement for production
[env.production.placement]
mode = "smart"
strategy = "closest"
hints = ["asia-southeast1"]

# Analytics for production
[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "makanmasak-metrics-prod"

# ========================================
# Cron Triggers (Scheduled Tasks)
# ========================================
[triggers]
# Daily at 2:00 AM UTC: Clean expired verification tokens
# Weekly on Sunday at 3:00 AM UTC: Clean old password change logs
crons = [
  "0 2 * * *",     # Daily token cleanup
  "0 3 * * *",     # Daily usage events TTL cleanup
  "0 3 * * SUN",   # Weekly log cleanup (CF rejects DOW=0; use SUN or 7)
  "30 2 * * *",    # Daily forecast warmup
  "*/5 * * * *",   # Usage meter aggregation
  "15 2 * * *",    # Billing lifecycle: cycle close, trial reaper, reminders
  "0 4 * * *"      # Stored-value credit expiry (breakage)
]

