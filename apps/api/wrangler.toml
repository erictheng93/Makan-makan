# MakanMakan API - Cloudflare Workers Configuration
# Updated to use latest wrangler 4.35.0

name = "makanmakan-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Development server configuration
[dev]
port = 8787
local_protocol = "http"
inspector_port = 9232

# Default variables for development
[vars]
NODE_ENV = "development"
API_VERSION = "v1"
API_BASE_URL = "http://localhost:8787"
CORS_ORIGIN = "*"
LOG_LEVEL = "debug"
REALTIME_WS_URL = "ws://localhost:8788"

# ===== Deployment Mode Configuration =====
# DEPLOYMENT_MODE: 'saas' (default) or 'independent'
# - saas: Multi-tenant centralized platform (default for development)
# - independent: Single-tenant managed deployment
DEPLOYMENT_MODE = "saas"
# For independent deployments, set these additional variables:
# TENANT_ID = "S-YYYYMMDD-NNN"           # Unique tenant identifier
# TENANT_NAME = "餐廳名稱"                # Display name
# LICENSE_KEY = "MKM-PRO-XXXXXX-XXXX"    # License key
# CENTRAL_API_URL = "https://manage.makanmakan.app"
# PLATFORM_VERSION = "1.0.0"

# JWT_SECRET - SECURITY: Use `wrangler secret put JWT_SECRET` instead of hardcoding
# For local development, set via environment variable or use a local .dev.vars file

# Notification Provider Configuration
# SECURITY: API keys should be set via `wrangler secret put` command
# Email provider (Resend)
NOTIFICATION_FROM_EMAIL = "notifications@makanmakan.com"
# RESEND_API_KEY - Set via: wrangler secret put RESEND_API_KEY
# SMS provider (Twilio)
# TWILIO_ACCOUNT_SID - Set via: wrangler secret put TWILIO_ACCOUNT_SID
# TWILIO_AUTH_TOKEN - Set via: wrangler secret put TWILIO_AUTH_TOKEN
TWILIO_PHONE_NUMBER = "+1234567890"  # Update with actual number

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "makanmakan-local"
database_id = "local"
migrations_dir = "../../packages/database/migrations_fresh"

# KV namespaces for caching and rate limiting
[[kv_namespaces]]
binding = "CACHE_KV"
id = "makanmakan-cache-dev"
preview_id = "makanmakan-cache-preview"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "makanmakan-ratelimit-dev"
preview_id = "makanmakan-ratelimit-preview"

[[kv_namespaces]]
binding = "BACKUP_KV"
id = "makanmakan-backup-dev"
preview_id = "makanmakan-backup-preview"

# R2 bucket for backup storage
[[r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmakan-backups-dev"
preview_bucket_name = "makanmakan-backups-preview"

# === DEVELOPMENT ENVIRONMENT ===
[env.development]
name = "makanmakan-api-dev"
[env.development.vars]
NODE_ENV = "development"
API_VERSION = "v1"
API_BASE_URL = "http://localhost:8787"
CORS_ORIGIN = "*"
LOG_LEVEL = "debug"
MAX_REQUEST_SIZE = "50MB"
CACHE_TTL = "60"
RATE_LIMIT_REQUESTS = "1000"
DEPLOYMENT_MODE = "saas"
PLATFORM_VERSION = "1.0.0"
REALTIME_WS_URL = "ws://localhost:8788"
# Notification configuration
NOTIFICATION_FROM_EMAIL = "dev-notifications@makanmakan.com"
TWILIO_PHONE_NUMBER = "+1234567890"

[[env.development.d1_databases]]
binding = "DB"
database_name = "makanmakan-local"
database_id = "local"

[[env.development.kv_namespaces]]
binding = "CACHE_KV"
id = "makanmakan-cache-dev"

[[env.development.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "makanmakan-ratelimit-dev"

[[env.development.kv_namespaces]]
binding = "BACKUP_KV"
id = "makanmakan-backup-dev"

[[env.development.r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmakan-backups-dev"

# === STAGING ENVIRONMENT ===
[env.staging]
name = "makanmakan-api-staging"
[env.staging.vars]
NODE_ENV = "staging"
API_VERSION = "v1"
API_BASE_URL = "https://api-staging.makanmakan.com"
CORS_ORIGIN = "https://staging.makanmakan.com"
LOG_LEVEL = "info"
MAX_REQUEST_SIZE = "10MB"
CACHE_TTL = "300"
RATE_LIMIT_REQUESTS = "500"
DEPLOYMENT_MODE = "saas"
PLATFORM_VERSION = "1.0.0"
CENTRAL_API_URL = "https://manage.makanmakan.app"
REALTIME_WS_URL = "wss://realtime-staging.makanmakan.workers.dev"
# Notification configuration
NOTIFICATION_FROM_EMAIL = "staging-notifications@makanmakan.com"
TWILIO_PHONE_NUMBER = "+1234567890"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "makanmakan-staging"
database_id = "staging-db-id"

[[env.staging.kv_namespaces]]
binding = "CACHE_KV"
id = "makanmakan-cache-staging"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "makanmakan-ratelimit-staging"

[[env.staging.kv_namespaces]]
binding = "BACKUP_KV"
id = "makanmakan-backup-staging"

# Token Blacklist KV for WebSocket authentication security
[[env.staging.kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "makanmakan-token-blacklist-staging"

[[env.staging.r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmakan-backups-staging"

# === PRODUCTION ENVIRONMENT ===
[env.production]
name = "makanmakan-api-prod"
[env.production.vars]
NODE_ENV = "production"
API_VERSION = "v1"
API_BASE_URL = "https://api.makanmakan.com"
CORS_ORIGIN = "https://makanmakan.com"
LOG_LEVEL = "warn"
MAX_REQUEST_SIZE = "5MB"
CACHE_TTL = "600"
RATE_LIMIT_REQUESTS = "100"
DEPLOYMENT_MODE = "saas"
PLATFORM_VERSION = "1.0.0"
CENTRAL_API_URL = "https://manage.makanmakan.app"
REALTIME_WS_URL = "wss://realtime.makanmakan.workers.dev"
# Notification configuration
NOTIFICATION_FROM_EMAIL = "notifications@makanmakan.com"
TWILIO_PHONE_NUMBER = "+1234567890"

[[env.production.d1_databases]]
binding = "DB"
database_name = "makanmakan-prod"
database_id = "production-db-id"

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "makanmakan-cache-prod"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "makanmakan-ratelimit-prod"

[[env.production.kv_namespaces]]
binding = "BACKUP_KV"
id = "makanmakan-backup-prod"

# Token Blacklist KV for WebSocket authentication security
[[env.production.kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "makanmakan-token-blacklist-prod"

[[env.production.r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmakan-backups-prod"

# Smart placement for production
[env.production.placement]
mode = "smart"
strategy = "closest"
hints = ["asia-southeast1"]

# Analytics for production
[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "makanmakan-metrics-prod"

# ========================================
# Cron Triggers (Scheduled Tasks)
# ========================================
[triggers]
# Daily at 2:00 AM UTC: Clean expired verification tokens
# Weekly on Sunday at 3:00 AM UTC: Clean old password change logs
crons = [
  "0 2 * * *",   # Daily token cleanup
  "0 3 * * 0",   # Weekly log cleanup
  "30 2 * * *"   # Daily forecast warmup
]

