# Percy Visual Testing Configuration
# Alternative to Chromatic for visual regression testing

version: 2

# Snapshot configuration
snapshot:
  # Widths to capture
  widths:
    - 375   # Mobile
    - 768   # Tablet
    - 1024  # Desktop
    - 1440  # Large Desktop
    - 1920  # Wide Desktop

  # Minimum height for snapshots
  min-height: 1024

  # Enable JavaScript
  enable-javascript: true

  # Percy CSS to inject
  percy-css: |
    /* Disable animations for consistent snapshots */
    *, *::before, *::after {
      animation-duration: 0s !important;
      animation-delay: 0s !important;
      transition-duration: 0s !important;
      transition-delay: 0s !important;
    }

    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }

  # Wait for selector before snapshot
  # wait-for-selector: ".app-loaded"

  # Wait for timeout (ms)
  # wait-for-timeout: 15000

  # Additional snapshots delay (ms)
  discovery:
    network-idle-timeout: 750

# Static snapshots configuration
static:
  # Base URL for Percy builds
  base-url: /

  # Include patterns
  include:
    - "**/*.html"

  # Exclude patterns
  exclude:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - ".git/**"
    - "**/*.test.*"
    - "**/*.spec.*"

# Agent configuration
agent:
  # Asset discovery
  asset-discovery:
    # Request headers
    request-headers:
      User-Agent: Percy/Agent

    # Allowed hostnames
    allowed-hostnames:
      - localhost

    # Network idle timeout
    network-idle-timeout: 750

    # Cache responses
    cache-responses: true

# Discovery configuration
discovery:
  # Disable asset discovery
  disable-asset-discovery: false

  # Request headers
  request-headers: {}

  # Allowed hostnames (for CORS)
  allowed-hostnames: []

  # Network idle timeout (ms)
  network-idle-timeout: 750

  # Disable cache
  disable-cache: false
